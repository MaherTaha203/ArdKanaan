name: CI

on:
  push:
    branches:
      - claude/ard-kanaan-phase-0-6rymjv
      - fix/finance-receipt-enrollment-only
      - claude/enrollment-fee-adjustment
  pull_request:
    branches:
      - claude/ard-kanaan-phase-0-6rymjv

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  db-financial-runtime:
    name: DB Runtime · Financial Firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real-path financial integration harness
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17-bookworm \
            bash -lc 'PGBIN=/usr/lib/postgresql/17/bin PG_RUNAS=postgres bash app/supabase/tests/external_share_layers.sh'

  db-concurrency-growth:
    name: DB Runtime · Concurrency & Growth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run concurrency and growth harness
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:17-bookworm \
            bash -lc 'PGBIN=/usr/lib/postgresql/17/bin PG_RUNAS=postgres bash app/supabase/tests/concurrency_growth.sh'

  db-integration:
    name: DB Integration · Enrollment Fee Adjustment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
      - name: Run real-path enrollment fee integration
        working-directory: app
        run: bash supabase/tests/enrollment_fee_adjustment.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin
